name: Render Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Comma-separated benchmark names"
        required: false
        default: "bvh_many_spheres,bvh_mixed_primitives"
      iterations:
        description: "Measured iterations"
        required: false
        default: "5"
      warmup:
        description: "Warmup iterations"
        required: false
        default: "1"
      publish:
        description: "Append results to benchmark-history"
        required: false
        default: "true"
  push:
    branches-ignore:
      - gh-pages
      - benchmark-history
  pull_request:
    branches-ignore:
      - gh-pages
      - benchmark-history

concurrency:
  group: render-benchmarks-history
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_config_name:
          - o3_native_no_simd
          - o3_native_simd_sse
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      IS_GHA: true
      RGL_USE_NULL: true
      BENCHMARKS: ${{ inputs.benchmarks || 'bvh_many_spheres,bvh_mixed_primitives' }}
      ITERATIONS: ${{ inputs.iterations || '3' }}
      WARMUP: ${{ inputs.warmup || '1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libx11-dev \
            libxml2-dev \
            libxt-dev \
            mesa-common-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::remotes

      - name: Benchmark regression tests
        if: matrix.build_config_name == 'o3_native_no_simd'
        run: Rscript -e 'testthat::test_dir("tools/benchmarks/tests", stop_on_failure = TRUE)'

      - uses: actions/setup-node@v4
        if: matrix.build_config_name == 'o3_native_no_simd'
        with:
          node-version: '22'

      - name: Dashboard browser smoke tests
        if: matrix.build_config_name == 'o3_native_no_simd'
        run: |
          npm ci --prefix tools/benchmarks/tests/browser
          npx --prefix tools/benchmarks/tests/browser playwright install --with-deps chromium
          Rscript tools/benchmarks/tests/build_fixtures.R "$RUNNER_TEMP/benchmark-fixtures"
          node tools/benchmarks/tests/browser/dashboard.cjs "$RUNNER_TEMP/benchmark-fixtures"

      - name: Run render benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/rayrender-benchmark-workdirs"
          Rscript tools/benchmarks/run_render_benchmarks.R \
            --repo . \
            --ref current \
            --config tools/benchmarks/configs/default.json \
            --only-config "${{ matrix.build_config_name }}" \
            --benchmarks "$BENCHMARKS" \
            --iterations "$ITERATIONS" \
            --warmup "$WARMUP" \
            --extra-r-arg "--time-build true" \
            --output "benchmark-results/${{ matrix.build_config_name }}.csv" \
            --workdir-root "$RUNNER_TEMP/rayrender-benchmark-workdirs" \
            --keep-workdirs \
            --no-append

      - name: Upload benchmark result CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.build_config_name }}
          path: benchmark-results/*
          if-no-files-found: warn

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs-${{ matrix.build_config_name }}
          path: |
            ${{ runner.temp }}/rayrender-benchmark-workdirs/**/logs/**
            ${{ runner.temp }}/rayrender-benchmark-workdirs/**/worker-results/**
          if-no-files-found: warn

  publish-history:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: >-
      ${{
        always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true'))
      }}
    env:
      BENCHMARKS: ${{ inputs.benchmarks || 'bvh_many_spheres,bvh_mixed_primitives' }}
      ITERATIONS: ${{ inputs.iterations || '3' }}
      WARMUP: ${{ inputs.warmup || '1' }}
      MATRIX_RESULT: ${{ needs.benchmark.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install history tooling
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Download benchmark result artifacts
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: benchmark-results-*
          path: downloaded-benchmark-results
          merge-multiple: false

      - name: Validate complete comparison and retain failures
        id: comparison
        continue-on-error: true
        run: |
          mkdir -p downloaded-benchmark-results
          Rscript tools/benchmarks/combine_benchmark_csvs.R \
            --input-dir downloaded-benchmark-results \
            --output combined-new-results.csv \
            --config tools/benchmarks/configs/default.json \
            --configs o3_native_no_simd,o3_native_simd_sse \
            --benchmarks "$BENCHMARKS" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --extra-r-arg "--time-build true" --matrix-result "$MATRIX_RESULT"

      - name: Upload comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: combined-new-results.csv
          if-no-files-found: error

      - name: Prepare benchmark-history worktree
        run: |
          git fetch origin benchmark-history:refs/remotes/origin/benchmark-history
          git worktree add --detach benchmark-history-worktree origin/benchmark-history

      - name: Append history
        run: |
          Rscript tools/benchmarks/append_benchmark_history.R \
            --history-dir benchmark-history-worktree --new-results combined-new-results.csv

      - name: Commit benchmark-history branch
        run: |
          cd benchmark-history-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update benchmark history for ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          fi
          git push origin HEAD:benchmark-history

      # Publication succeeds independently of measurement validity. workflow_run
      # checks the publication step so failed attempts can deploy diagnostics.
      - name: Fail invalid benchmark attempt
        if: steps.comparison.outcome != 'success' || needs.benchmark.result != 'success'
        run: exit 1
