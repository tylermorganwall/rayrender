# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: [Render Benchmarks]
    types: [completed]

name: pkgdown.yaml

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.run_id || 'deploy' }}
  cancel-in-progress: false

jobs:
  history-ready:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ready: ${{ steps.publication.outputs.ready }}
    steps:
      - uses: actions/github-script@v7
        id: publication
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('ready', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            const published = jobs.some(job => job.name === 'publish-history' &&
              job.steps.some(step => step.name === 'Commit benchmark-history branch' && step.conclusion === 'success'));
            core.setOutput('ready', String(published));

  pkgdown:
    needs: history-ready
    if: needs.history-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      history_sha: ${{ steps.history.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deployment code comes from the trusted current default branch.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      # --- Download and Install OIDN ---
      - name: Install OIDN (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          if [ "${ARCH}" = "arm64" ]; then
            # Download ARM64 (Apple Silicon) OIDN build
            curl -LO https://github.com/OpenImageDenoise/oidn/releases/download/v2.3.1/oidn-2.3.1.arm64.macos.tar.gz
            tar xzf oidn-2.3.1.arm64.macos.tar.gz
            echo "OIDN_PATH=$(pwd)/oidn-2.3.1.arm64.macos" >> $GITHUB_ENV
          else
            # Download x86_64 OIDN build
            curl -LO https://github.com/OpenImageDenoise/oidn/releases/download/v2.3.1/oidn-2.3.1.x86_64.macos.tar.gz
            tar xzf oidn-2.3.1.x86_64.macos.tar.gz
            echo "OIDN_PATH=$(pwd)/oidn-2.3.1.x86_64.macos" >> $GITHUB_ENV
          fi

      - name: Install OIDN (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -LO https://github.com/OpenImageDenoise/oidn/releases/download/v2.3.1/oidn-2.3.1.x86_64.linux.tar.gz
          tar xzf oidn-2.3.1.x86_64.linux.tar.gz
          echo "OIDN_PATH=$(pwd)/oidn-2.3.1.x86_64.linux" >> $GITHUB_ENV

      - name: Install OIDN (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -LO https://github.com/OpenImageDenoise/oidn/releases/download/v2.3.1/oidn-2.3.1.x64.windows.zip
          7z x oidn-2.3.1.x64.windows.zip
          echo "OIDN_PATH=$(pwd)/oidn-2.3.1.x64.windows" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Fix git pkgdown build
        run: git config --global http.postBuffer 524288000

      - name: Download sky model data for rendered examples
        run: |
          Rscript -e 'skymodelr::download_sky_data(sea_level = TRUE); skymodelr::download_sky_data(sea_level = FALSE)'

      - name: Build site
        run: Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      - name: Add benchmark page
        id: history
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-history/data"
          git fetch --depth=1 origin benchmark-history:refs/remotes/origin/benchmark-history
          git show origin/benchmark-history:data/render_benchmarks.csv > "$RUNNER_TEMP/benchmark-history/data/render_benchmarks.csv"
          test -s "$RUNNER_TEMP/benchmark-history/data/render_benchmarks.csv"
          echo "sha=$(git rev-parse origin/benchmark-history)" >> "$GITHUB_OUTPUT"
          Rscript tools/benchmarks/build_benchmark_site.R \
            --history-csv "$RUNNER_TEMP/benchmark-history/data/render_benchmarks.csv" \
            --site-dir docs/benchmarks

      - name: Record site source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload site for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: pkgdown
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs
      - name: Check deployment freshness
        id: freshness
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.pkgdown.outputs.source_sha }}
          HISTORY_SHA: ${{ needs.pkgdown.outputs.history_sha }}
        run: |
          current_source=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          current_history=$(git ls-remote origin refs/heads/benchmark-history | cut -f1)
          if [ "$SOURCE_SHA" = "$current_source" ] && [ "$HISTORY_SHA" = "$current_history" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded site build; a newer completion rebuilds the site.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to GitHub pages 🚀
        if: steps.freshness.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
