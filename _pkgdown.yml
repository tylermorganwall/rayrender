url: https://www.rayrender.net/
pandoc: 2.3.1
pkgdown: 1.3.0.9000
pkgdown_sha: 2f40b4769ea9ad2312aa4cc93f27ab116461543b
template:
  opengraph:
    image:
      src: man/figures/website_rayrender.jpg
      alt: Picture of a golden 3D ggplot with a description of rayrender
    twitter:
      creator: '@tylermorganwall'
      card: summary_large_image
figures:
  dpi: 96
  dev.args: []
  fig.ext: png
  fig.width: 8
  fig.height: ~
  fig.retina: 2
  fig.asp: 1
  bg: NA
  other.parameters: []
reference:
- title: Objects
  desc: Functions for generating objects to add to scenes
  contents:
  - starts_with("sphere")
  - starts_with("cube")
  - ends_with("rect")
  - ends_with("cornell")
  - ends_with("ground")
  - ends_with("studio")
  - starts_with("segment")
  - starts_with("cylinder")
  - starts_with("triangle")
  - starts_with("ellipsoid")
  - starts_with("disk")
  - starts_with("obj")
  - starts_with("ply")
  - starts_with("mesh3d")
  - starts_with("cone")
  - starts_with("arrow")
  - starts_with("extruded")
  - starts_with("bezier")
  - starts_with("path")
  - starts_with("pig")
  - starts_with("text")
  - starts_with("csg_object")
  - starts_with("r_obj")
  - starts_with("raymesh")
  - cloud
- title: Constructive Solid Geometry (CSG) Interface
  desc: Functions to model and build objects using CSG
  contents: starts_with("csg")
- title: Materials
  desc: Functions to specify the visual properties of objects
  contents:
  - starts_with("diffuse")
  - starts_with("metal")
  - starts_with("dielectric")
  - starts_with("microfacet")
  - starts_with("glossy")
  - starts_with("light")
  - starts_with("hair")
  - starts_with("lambertian")
  - starts_with("set_scene_material")
  - openpbr
  - translucent
  - subsurface
  - subsurface_diffusion
- title: Participating Media
  desc: Functions to define and attach scattering, absorbing, and emitting media.
  contents:
  - homogeneous_medium
  - grid_medium
  - nanovdb_medium
  - set_medium
- title: Point, Spot, and Projection Lights
  desc: Create, attach, and manage lights at positions in the scene.
  contents:
  - point_light
  - projection_light
  - add_light
  - get_light
- title: Infinite and Sky Lights
  desc: Functions to create and manage image, atmospheric, Sun, and Moon lighting.
  contents:
  - infinite_light
  - sky_light
  - sky_light_image
  - sun_light
  - disk_light
  - add_infinite_light
  - get_infinite_light
  - list_infinite_lights
  - remove_infinite_light
- title: Cameras
  desc: Functions to create, select, and preview scene cameras.
  contents:
  - camera
  - add_camera
  - get_camera
  - list_cameras
  - set_active_camera
  - preview_camera
  - remove_camera
- title: Composing Scenes
  desc: Function for adding objects together to form a scene.
  contents:
  - add_object
  - starts_with("group")
  - starts_with("create")
- title: Scene Import and Export
  desc: Import PBRT scenes and save or restore rayrender scenes with OpenUSD.
  contents:
  - read_pbrt
  - write_usd
  - read_usd
- title: Screen-space Annotations
  desc: Functions for adding 2D annotations anchored to 3D scene positions.
  contents: starts_with("screen")
- title: Animating Scenes
  desc: Function for animating objects or the camera through a scene.
  contents:
  - get_saved_keyframes
  - starts_with("generate_camera_motion")
  - animate_objects
  - starts_with("animation_")
- title: Render Raytraced Scene
  desc: Function to render the current scene.
  contents:
  - starts_with("render")
  - set_render_settings
- title: Capabilities
  desc: Functions to query compiled capabilities.
  contents:
  - has_denoiser
